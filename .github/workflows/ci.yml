name: CI

on:
  push:
    branches: [dev, production, main]
  pull_request:
    branches: [dev, production, main]

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout backend contract source
        uses: actions/checkout@v4
        with:
          repository: AdsPlatformOrg/crimfig.com-backend
          ref: 4f77ad908a850ba0e7a4ac41a33c4866a5f60484
          path: backend

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (enforces pnpm — blocks npm/yarn)
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend contract dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Platform access behavior
        run: node --test web/ads/test/plan0156-platform-access.test.cjs

      - name: Build (affected packages)
        run: pnpm run build
